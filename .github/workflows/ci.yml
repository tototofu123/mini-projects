name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame (for import check)
        run: pip install pygame
      - name: Check Python syntax
        run: python -m py_compile game.py
      - name: Run game import check
        run: python -c "import py_compile; py_compile.compile('game.py', doraise=True)"

  js-check:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract and lint JS from index.html
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const match = html.match(/<script>([\\s\\S]*?)<\\/script>/);
            if (!match) { console.log('No script tag found'); process.exit(1); }
            try { new Function(match[1]); console.log('JS syntax OK'); }
            catch(e) { console.error('JS syntax error:', e.message); process.exit(1); }
          "
