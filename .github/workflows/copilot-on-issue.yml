name: Auto-label and assign Copilot

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  label-and-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Auto-label based on title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.issue?.title || context.payload.pull_request?.title || '';
            const labels = [];

            if (/bug|fix|broken|error|crash|issue/i.test(title)) labels.push('bug');
            if (/feature|enhancement|request|want|would like/i.test(title)) labels.push('enhancement');
            if (/docs?|readme|documentation/i.test(title)) labels.push('documentation');
            if (/question|how|help|?$/i.test(title)) labels.push('question');
            if (/test/i.test(title)) labels.push('tests');
            if (/deps?|upgrade|update|version/i.test(title)) labels.push('dependencies');

            if (labels.length > 0) {
              if (context.payload.issue) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: labels
                });
              } else if (context.payload.pull_request) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: labels
                });
              }
              console.log('Added labels:', labels.join(', '));
            }

      - name: Assign Copilot to issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: ['copilot']
              });
              console.log('Copilot assigned');
            } catch (e) {
              console.log('Could not assign copilot:', e.message);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 🤖 Copilot is on it!',
                '',
                'This issue has been picked up automatically.',
                '',
                '**What happens next:**',
                '1. Copilot will read this issue',
                '2. It will create a new branch and edit the code',
                '3. It will open a **Pull Request** for you to review',
                '',
                '> Track progress in the [Actions tab](../../actions).'
              ].join('\n')
            });
