name: Auto-assign Copilot on new issues

on:
  issues:
    types: [opened, reopened]

jobs:
  assign-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign Copilot to issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Try to assign copilot (works with Copilot Individual/Business/Enterprise)
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: ['copilot']
              });
              console.log('Copilot assigned successfully');
            } catch (e) {
              console.log('Could not assign copilot:', e.message);
            }

            // Always post the comment so you know the workflow fired
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 🤖 Copilot is on it!',
                '',
                'This issue has been picked up automatically.',
                '',
                '**What happens next:**',
                '1. Copilot will read this issue',
                '2. It will create a new branch and edit the code',
                '3. It will open a **Pull Request** for you to review',
                '',
                '> Track progress in the [Actions tab](../../actions).'
              ].join('\n')
            });
