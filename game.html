<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumping Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #141423;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
  overflow: hidden;
  user-select: none;
}
canvas {
  border-radius: 8px;
  box-shadow: 0 0 30px rgba(100, 200, 255, 0.15);
  touch-action: none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 480, H = 640;
canvas.width = W;
canvas.height = H;

const GRAVITY = 0.5;
const JUMP_FORCE = -12;
const MOVE_SPEED = 6;
// Vertical gap between platforms (in pixels) — consistent spacing
const PLATFORM_GAP = 80;

const BG = '#141423';
const PLAYER_COLOR = '#64c8ff';
const PLATFORM_COLOR = '#50dc8c';
const WHITE = '#ffffff';

let player, platforms, score, platformsCleared, gameOver, keys, animId;

function init() {
  player = { x: W / 2 - 15, y: H - 60, w: 30, h: 30, vy: 0 };
  platforms = [];
  score = 0;
  platformsCleared = 0;
  gameOver = false;
  keys = {};

  // Seed initial platforms with consistent vertical spacing from bottom
  for (let i = 0; i < 8; i++) {
    platforms.push(makePlatform(H - 80 - i * PLATFORM_GAP));
  }
  // Always put the first platform right under the player
  platforms[0].x = player.x - 10;
  platforms[0].y = player.y + player.h + 4;
}

function makePlatform(y) {
  return {
    x: Math.random() * (W - 70),
    y: y,
    w: 70,
    h: 12
  };
}

// Find the topmost platform y currently in the array
function topPlatformY() {
  let top = Infinity;
  for (let p of platforms) if (p.y < top) top = p.y;
  return top;
}

// Fill platforms upward from the current topmost, spaced consistently
function generatePlatforms() {
  let top = topPlatformY();
  // Keep generating above the viewport until we have enough offscreen buffer
  while (top > -PLATFORM_GAP * 3) {
    top -= PLATFORM_GAP;
    platforms.push(makePlatform(top));
  }
}

function update() {
  if (gameOver) return;

  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= MOVE_SPEED;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += MOVE_SPEED;

  player.vy += GRAVITY;
  player.y += player.vy;

  // Wrap horizontally
  if (player.x + player.w < 0) player.x = W;
  if (player.x > W) player.x = -player.w;

  // Scroll world upward when player passes midscreen while falling upward (vy < 0)
  if (player.vy < 0 && player.y < H / 2) {
    const shift = H / 2 - player.y;
    player.y = H / 2;
    for (let p of platforms) p.y += shift;

    // Count platforms that scroll off the bottom as cleared
    const before = platforms.length;
    platforms = platforms.filter(p => p.y < H + 20);
    const removed = before - platforms.length;
    platformsCleared += removed;
    score = platformsCleared * 10;

    generatePlatforms();
  }

  // Platform collision — only when falling down
  for (let p of platforms) {
    if (player.vy > 0 &&
        player.x + player.w > p.x &&
        player.x < p.x + p.w &&
        player.y + player.h >= p.y &&
        player.y + player.h <= p.y + p.h + 10) {
      player.vy = JUMP_FORCE;
    }
  }

  // Fell below screen
  if (player.y > H + 50) gameOver = true;
}

function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = PLATFORM_COLOR;
  for (let p of platforms) {
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 6);
    ctx.fill();
  }

  ctx.fillStyle = PLAYER_COLOR;
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.w, player.h, 6);
  ctx.fill();

  ctx.fillStyle = WHITE;
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'start';
  ctx.fillText(`Score: ${score}`, 12, 32);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = WHITE;
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over!', W / 2, H / 2 - 30);
    ctx.font = 'bold 28px Arial';
    ctx.fillStyle = '#64c8ff';
    ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 10);
    ctx.font = '20px Arial';
    ctx.fillStyle = WHITE;
    ctx.fillText('SPACE / Tap to restart', W / 2, H / 2 + 50);
    ctx.textAlign = 'start';
  }
}

function loop() {
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function restart() {
  if (animId) cancelAnimationFrame(animId);
  init();
  loop();
}

// Keyboard
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (gameOver) restart();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch controls — left/right halves of screen move player; tap on game over restarts
let touchX = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const tx = t.clientX - rect.left;
  touchX = tx;
  if (gameOver) restart();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
  const half = W / 2;
  keys['ArrowLeft'] = touchX < half;
  keys['ArrowRight'] = touchX >= half;
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touchX = null;
  keys['ArrowLeft'] = false;
  keys['ArrowRight'] = false;
}, { passive: false });

init();
loop();
</script>
</body>
</html>
