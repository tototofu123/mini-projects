<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jumping Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #141423;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
  overflow: hidden;
  user-select: none;
}
canvas {
  border-radius: 8px;
  box-shadow: 0 0 30px rgba(100, 200, 255, 0.15);
  touch-action: none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 480, H = 640;
canvas.width = W;
canvas.height = H;

const GRAVITY = 0.5;
const JUMP_FORCE = -12;
const MOVE_SPEED = 6;
const MIN_VERT_GAP = 45;
const MAX_VERT_GAP = 105;
const PLAT_W = 70, PLAT_H = 12;

const BG = '#141423';
const PLAYER_COLOR = '#64c8ff';
const PLATFORM_COLOR = '#50dc8c';
const WHITE = '#ffffff';

const SHAPE_SEQUENCES = ['straight', 'zigzag', 'u_curve', 'drift'];

function createPlatformGenerator(startX, startY) {
  let prevX = startX;
  let prevY = startY;
  let shape = 'straight';
  let shapeStep = 0;
  let shapeLength = 3 + Math.floor(Math.random() * 4);
  let shapeRemaining = shapeLength;

  function pickNewShape() {
    shape = SHAPE_SEQUENCES[Math.floor(Math.random() * SHAPE_SEQUENCES.length)];
    shapeLength = 3 + Math.floor(Math.random() * 4);
    shapeRemaining = shapeLength;
    shapeStep = 0;
  }

  function next() {
    const dy = MIN_VERT_GAP + Math.floor(Math.random() * (MAX_VERT_GAP - MIN_VERT_GAP + 1));
    const newY = prevY - dy;
    let dx;

    switch (shape) {
      case 'straight':
        dx = Math.floor(Math.random() * 121) - 60;
        break;
      case 'zigzag':
        dx = (shapeStep % 2 === 0 ? 1 : -1) * (80 + Math.floor(Math.random() * 71));
        break;
      case 'u_curve':
        dx = shapeStep < Math.floor(shapeLength / 2)
          ? 90 + Math.floor(Math.random() * 51)
          : -(90 + Math.floor(Math.random() * 51));
        break;
      case 'drift':
        dx = (Math.random() < 0.5 ? 1 : -1) * (30 + Math.floor(Math.random() * 51));
        break;
    }

    let newX = prevX + dx;
    newX = ((newX % (W - PLAT_W)) + (W - PLAT_W)) % (W - PLAT_W);
    newX = Math.max(0, Math.min(W - PLAT_W, newX));

    prevX = newX;
    prevY = newY;

    shapeStep++;
    shapeRemaining--;
    if (shapeRemaining <= 0) pickNewShape();

    return { x: newX, y: newY, w: PLAT_W, h: PLAT_H };
  }

  return { next };
}

let player, platforms, score, platformsCleared, gameOver, keys, animId, gen;

function init() {
  player = { x: W / 2 - 15, y: H - 60, w: 30, h: 30, vy: 0, onGround: false };
  platforms = [];
  score = 0;
  platformsCleared = 0;
  gameOver = false;
  keys = {};

  const startX = W / 2 - PLAT_W / 2;
  const startY = H - 50;
  platforms.push({ x: startX, y: startY, w: PLAT_W, h: PLAT_H });
  gen = createPlatformGenerator(startX, startY);

  // Put the first platform right under the player
  platforms[0].x = player.x - 10;
  platforms[0].y = player.y + player.h + 4;

  for (let i = 0; i < 8; i++) {
    platforms.push(gen.next());
  }
}

function generatePlatforms() {
  while (platforms.length < 10) {
    platforms.push(gen.next());
  }
}

function update() {
  if (gameOver) return;

  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= MOVE_SPEED;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += MOVE_SPEED;

  player.vy += GRAVITY;
  player.y += player.vy;

  // Wrap horizontally
  if (player.x + player.w < 0) player.x = W;
  if (player.x > W) player.x = -player.w;

  // Scroll world upward when player passes midscreen while falling upward (vy < 0)
  if (player.vy < 0 && player.y < H / 2) {
    const shift = H / 2 - player.y;
    player.y = H / 2;
    for (let p of platforms) p.y += shift;

    // Count platforms that scroll off the bottom as cleared
    const before = platforms.length;
    platforms = platforms.filter(p => p.y < H + 20);
    const removed = before - platforms.length;
    platformsCleared += removed;
    score = platformsCleared * 10;

    generatePlatforms();
  }

  // Platform collision — only when falling down (swept check prevents tunneling)
  player.onGround = false;
  const prevBottom = player.y - player.vy + player.h;
  for (let p of platforms) {
    if (player.vy > 0 &&
        player.x + player.w > p.x &&
        player.x < p.x + p.w &&
        prevBottom <= p.y + 5 &&
        player.y + player.h >= p.y - 5) {
      player.vy = 0;
      player.y = p.y - player.h;
      player.onGround = true;
    }
  }

  // Fell below screen
  if (player.y > H + 50) gameOver = true;
}

function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = PLATFORM_COLOR;
  for (let p of platforms) {
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 6);
    ctx.fill();
  }

  ctx.fillStyle = PLAYER_COLOR;
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.w, player.h, 6);
  ctx.fill();

  ctx.fillStyle = WHITE;
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'start';
  ctx.fillText(`Score: ${score}`, 12, 32);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = WHITE;
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over!', W / 2, H / 2 - 30);
    ctx.font = 'bold 28px Arial';
    ctx.fillStyle = '#64c8ff';
    ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 10);
    ctx.font = '20px Arial';
    ctx.fillStyle = WHITE;
    ctx.fillText('SPACE / Tap to restart', W / 2, H / 2 + 50);
    ctx.textAlign = 'start';
  }
}

function loop() {
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function restart() {
  if (animId) cancelAnimationFrame(animId);
  init();
  loop();
}

// Keyboard
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (gameOver) {
      restart();
    } else if (player.onGround) {
      player.vy = JUMP_FORCE;
      player.onGround = false;
    }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch controls — drag to move horizontally, quick-tap or swipe-up to jump
let touchStartX = null, touchStartY = null, touchLastY = null, touchStartTime = null;
let touchMoved = false;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  touchStartX = t.clientX - rect.left;
  touchStartY = touchLastY = t.clientY - rect.top;
  touchStartTime = Date.now();
  touchMoved = false;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const cx = t.clientX - rect.left;
  touchLastY = t.clientY - rect.top;
  touchMoved = true;
  const half = W / 2;
  keys['ArrowLeft'] = cx < half;
  keys['ArrowRight'] = cx >= half;
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const elapsed = Date.now() - touchStartTime;
  if (gameOver) {
    restart();
  } else if (!touchMoved && elapsed < 250) {
    // Quick tap = jump
    if (player.onGround) {
      player.vy = JUMP_FORCE;
      player.onGround = false;
    }
  } else if (touchMoved && touchStartY - touchLastY > 30) {
    // Swipe up = jump
    if (player.onGround) {
      player.vy = JUMP_FORCE;
      player.onGround = false;
    }
  }
  touchStartX = null;
  touchStartY = null;
  touchLastY = null;
  touchStartTime = null;
  touchMoved = false;
  keys['ArrowLeft'] = false;
  keys['ArrowRight'] = false;
}, { passive: false });

init();
loop();
</script>
</body>
</html>
